{% extends "base.html" %}
{% block title %} — Einstellungen{% endblock %}
{% block content %}
<div class="page-header"><h1>Einstellungen & Protokolle</h1></div>

<div class="card tab-wrap">
    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('settings-tabs', 'tab-log')">SMTP-Fehlerprotokoll</button>
        <button class="tab-btn" onclick="showTab('settings-tabs', 'tab-global')">Globale Konfiguration</button>
    </div>
    <div id="settings-tabs">
        <div id="tab-log" class="tab-content active">
            <div class="flex justify-between items-center mb-md">
                <button class="btn btn-secondary btn-sm" hx-get="/settings/log" hx-target="#log-box" hx-swap="innerHTML">Aktualisieren</button>
                <form method="post" action="/settings/log/clear" onsubmit="return confirm('Protokoll wirklich leeren?')">
                    <button class="btn btn-danger btn-sm">Leeren</button>
                </form>
            </div>
            <div id="log-box" hx-get="/settings/log" hx-trigger="every 10s" hx-swap="innerHTML">
                <pre class="log">{{ log_text }}</pre>
            </div>
        </div>

        <div id="tab-global" class="tab-content">
            <form method="post" action="/settings/save" class="flex flex-col gap-sm" style="max-width:500px">
                <div class="form-row">
                    <label>Cloudinary Cloud Name</label>
                    <input name="cloudinary_cloud_name" value="{{ config.get('cloudinary_cloud_name', '') }}">
                </div>
                <div class="form-row">
                    <label>Cloudinary API Key</label>
                    <input name="cloudinary_api_key" value="{{ config.get('cloudinary_api_key', '') }}">
                </div>
                <div class="form-row">
                    <label>Cloudinary API Secret</label>
                    <input name="cloudinary_api_secret" type="password" value="{{ config.get('cloudinary_api_secret', '') }}">
                </div>
                <div class="form-row">
                    <label>MXToolbox API Key</label>
                    <input name="mxtoolbox_api_key" value="{{ config.get('mxtoolbox_api_key', '') }}" placeholder="Für Blacklist-Prüfung">
                    <div class="form-help">Optional — wird für automatische Blacklist-Prüfungen der Sendedomains verwendet.</div>
                </div>
                <div class="mt-md"><button class="btn btn-primary">Speichern</button></div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
