<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactional Mailer — Anmelden</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="login-card">
        {% if app_cfg and app_cfg.login_logo %}
        <div class="text-center mb-md">
            <img src="{{ app_cfg.login_logo }}" style="max-width:200px;max-height:60px" alt="Logo">
        </div>
        {% else %}
        <h1 class="text-center">Transactional Mailer</h1>
        {% endif %}
        <p class="subtitle text-center mb-lg">Anmelden</p>
        {% if error %}<div class="alert alert-danger mb-md">{{ error }}</div>{% endif %}
        <form method="post" action="/login">
            <label>Benutzername</label>
            <input name="username" required autofocus>
            <label>Passwort</label>
            <input name="password" type="password" required>
            <div class="mt-lg">
                <button class="btn btn-primary w-full">Anmelden</button>
            </div>
        </form>
    </div>
</body>
</html>
