<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactional Mailer — Einrichtung</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="setup-card">
        <h1 class="text-center">Willkommen</h1>
        <p class="subtitle text-center">Administratorkonto erstellen</p>
        {% if error %}<div class="alert alert-danger mb-md">{{ error }}</div>{% endif %}
        <form method="post" action="/setup">
            <label>Benutzername</label><input name="username" required autofocus>
            <label>Anzeigename</label><input name="display_name" placeholder="Admin">
            <label>Passwort</label><input name="password" type="password" required placeholder="Mind. 6 Zeichen">
            <label>Passwort bestätigen</label><input name="password2" type="password" required>
            <div class="mt-md"><button class="btn btn-primary w-full">Konto erstellen</button></div>
        </form>
    </div>
</body>
</html>
