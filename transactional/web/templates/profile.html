{% extends "base.html" %}
{% block title %} — Profil{% endblock %}
{% block content %}
<div class="page-header"><h1>Profil</h1></div>
<div class="grid-2 items-start">
    <div class="card">
        <h3>Profileinstellungen</h3>
        <form method="post" action="/profile/update">
            <label>Benutzername</label>
            <input value="{{ user.username }}" disabled style="background:var(--bg3);color:var(--fg2)">
            <label>Anzeigename</label>
            <input name="display_name" value="{{ user.display_name or '' }}">
            <div class="mt-md"><button class="btn btn-primary">Speichern</button></div>
        </form>
    </div>
    <div class="card">
        <h3>Sidebar-Logo</h3>
        {% if user.logo_path %}
        <div class="mb-md text-center" style="padding:12px;background:var(--bg);border-radius:var(--radius)">
            <img src="{{ user.logo_path }}" style="max-width:140px;max-height:50px;object-fit:contain">
        </div>
        <form method="post" action="/profile/logo/delete" class="mb-md">
            <button class="btn btn-danger btn-sm">Logo entfernen</button>
        </form>
        {% endif %}
        <form method="post" action="/profile/logo" enctype="multipart/form-data">
            <label>Logo hochladen</label>
            <input type="file" name="logo" accept=".png,.jpg,.jpeg,.svg,.webp" required>
            <div class="form-help">Max. 2 MB. Wird in der Sidebar angezeigt.</div>
            <div class="mt-sm"><button class="btn btn-primary btn-sm">Hochladen</button></div>
        </form>
    </div>
</div>
<div class="card" style="max-width:400px">
    <h3>Passwort ändern</h3>
    <form method="post" action="/profile/password">
        <label>Aktuelles Passwort</label><input name="current_password" type="password" required>
        <label>Neues Passwort (mind. 6)</label><input name="new_password" type="password" required>
        <div class="mt-md"><button class="btn btn-danger">Passwort ändern</button></div>
    </form>
</div>
{% endblock %}
