    <td style="background-color: {pc}; color: #ffffff; font-family: {font}; font-size: 11px; font-weight: bold; letter-spacing: 2px; padding: 8px 16px; border-radius: 6px 6px 0 0;">FRIST</td>
  </tr>
  <tr>
    <td style="background-color: {light_bg}; padding: 14px 16px; border: 1px solid #e0e0e0; border-top: none; border-radius: 0 0 6px 6px; font-family: {font};">
      <div style="font-size: 15px; font-weight: bold; color: #333; line-height: 1.5;">{FristText1}</div>
      <div style="font-size: 13px; color: #666; line-height: 1.5; margin-top: 6px;">{FristText2}</div>
    </td>
  </tr>
</table>
